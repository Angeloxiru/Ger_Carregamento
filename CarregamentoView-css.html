<style>
/**
 * Estilos da tela do coletor (carregamento)
 * Pensada para coletores Android de 4" a 6": letras grandes, alto contraste,
 * resposta visual forte a cada leitura.
 */
body { font-size: 17px; }

.topo-conteudo { padding: 10px 14px 14px; max-width: 900px; }
.topo-conteudo { gap: 8px; }
.marca { font-size: 17px; min-width: 0; }
.marca > div { min-width: 0; }
.marca small { overflow: hidden; text-overflow: ellipsis; }
.topo-acoes { flex-shrink: 0; gap: 6px; }

/* Indicador de envio das leituras */
.sinc {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
  background: rgba(255,255,255,.14);
  white-space: nowrap;
}
.sinc-ok { color: #9BE7B4; }
.sinc-enviando { color: var(--amarelo); }
.sinc-erro { color: #FF9AA8; }
.sinc span { color: #fff; }

/* ============ ESTADO ============ */
.tela-estado {
  min-height: calc(100dvh - 70px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px; text-align: center; color: var(--texto-2);
}
.tela-estado .icone { font-size: 56px; }
.tela-estado h2 { margin: 0; color: var(--texto); font-size: 24px; }
.tela-estado p { margin: 0; max-width: 440px; }
.tela-fim h2 { color: var(--verde); }

#app { max-width: 900px; margin: 0 auto; padding-bottom: 96px; }

/* ============ PROGRESSO GERAL ============ */
.geral { padding: 12px 14px 10px; background: var(--superficie); border-bottom: 1px solid var(--borda); }
.geral-linha { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.geral-linha span { color: var(--texto-2); font-size: 15px; }

/* ============ NOTA ATUAL ============ */
.nota {
  margin: 12px 12px 0;
  padding: 14px 16px;
  border-radius: var(--raio);
  background: var(--verde-escuro);
  color: #fff;
  box-shadow: var(--sombra);
}
:root[data-tema="escuro"] .nota { background: #14361F; }
.nota-ordem { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .85; }
.nota-cabeca { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 2px; }
.nota-num { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.nota-itens { font-size: 15px; font-weight: 700; background: rgba(255,255,255,.16); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.nota-cliente { font-size: 19px; font-weight: 700; line-height: 1.25; margin-top: 4px; }
.nota-cidade { font-size: 14px; opacity: .85; margin-top: 2px; }

/* ============ LEITURA ============ */
.leitura {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr) 52px;
  gap: 8px;
  padding: 12px 12px 0;
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--fundo);
  padding-bottom: 8px;
}
.leitura-qtd { display: flex; flex-direction: column; gap: 2px; }
.leitura-qtd span { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--texto-2); text-align: center; }
.leitura input {
  width: 100%;
  min-height: 56px;
  border-radius: var(--raio-sm);
  border: 2px solid var(--borda);
  background: var(--superficie);
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.leitura-qtd input { min-height: 40px; font-size: 20px; padding: 0 4px; }
.leitura-qtd input:not(:placeholder-shown) { border-color: var(--amarelo); background: var(--amarelo-claro); }
.leitura-codigo { margin-top: 15px; font-family: var(--fonte-mono); letter-spacing: .03em; }
.leitura input::placeholder { color: var(--texto-3); font-weight: 500; opacity: .7; }
.leitura-codigo::placeholder { font-family: var(--fonte); font-size: 16px; letter-spacing: 0; }
.leitura input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 4px var(--verde-claro); }
.leitura .btn-icone { margin-top: 15px; width: 52px; min-height: 56px; font-size: 22px; }
#btnTeclado[aria-pressed="true"] { background: var(--azul-claro); border-color: var(--azul); }

/* Resposta de cada leitura */
.retorno {
  margin: 0 12px;
  padding: 12px 14px;
  border-radius: var(--raio-sm);
  font-size: 17px;
  font-weight: 700;
  background: var(--superficie);
  border: 1px solid var(--borda);
  color: var(--texto-2);
  min-height: 52px;
  display: flex; align-items: center;
}
.retorno.ok { background: var(--verde); color: #fff; border-color: transparent; animation: pulsar .3s ease; }
:root[data-tema="escuro"] .retorno.ok { color: #0B1A10; }
.retorno.erro { background: var(--vermelho); color: #fff; border-color: transparent; animation: tremer .35s ease; }
:root[data-tema="escuro"] .retorno.erro { color: #1A0509; }
@keyframes pulsar { 50% { transform: scale(1.02); } }
@keyframes tremer { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Nota completa */
.nota-completa {
  margin: 12px;
  padding: 14px;
  border-radius: var(--raio);
  background: var(--verde-claro);
  border: 2px solid var(--verde);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 12px;
  align-items: center;
}
.nota-completa-icone {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--verde); color: #fff;
  display: grid; place-items: center; font-size: 24px; font-weight: 800;
}
.nota-completa strong { display: block; font-size: 19px; color: var(--verde); }
.nota-completa span { font-size: 14px; color: var(--texto-2); }
.nota-completa .btn { grid-column: 1 / -1; min-height: 56px; font-size: 18px; }

/* ============ ITENS ============ */
.itens { list-style: none; margin: 12px 12px 0; padding: 0; display: grid; gap: 8px; }
.item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 12px;
  align-items: center;
  padding: 12px 14px;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-left: 6px solid var(--borda);
  border-radius: var(--raio-sm);
}
.item-desc { font-weight: 700; line-height: 1.25; }
.item-desc small { display: block; font-weight: 500; color: var(--texto-2); font-size: 13px; margin-top: 2px; font-family: var(--fonte-mono); word-break: break-all; }
.item-qtd { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; color: var(--texto-2); }
.item-qtd strong { font-size: 24px; color: var(--texto); }
.item .progresso { grid-column: 1 / -1; height: 6px; }
.item .btn { grid-column: 1 / -1; }

.item.parcial { border-left-color: var(--amarelo); }
.item.completo { background: var(--verde-claro); border-color: transparent; border-left-color: var(--verde); }
.item.completo .item-qtd strong { color: var(--verde); }
.item.completo .item-desc::before { content: "✓ "; color: var(--verde); }
.item.sem-codigo:not(.completo) { border-left-color: var(--azul); }
.item.piscar { animation: piscar .7s ease; }
@keyframes piscar { 0% { box-shadow: 0 0 0 4px var(--amarelo); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ============ BARRA INFERIOR ============ */
.barra-inferior {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--superficie);
  border-top: 1px solid var(--borda);
  box-shadow: 0 -4px 16px rgba(0,0,0,.08);
}
.barra-inferior .btn { min-height: 52px; font-size: 18px; }
.barra-inferior .btn span { font-size: 15px; }
.toasts { bottom: calc(84px + env(safe-area-inset-bottom)); }

/* ============ LISTA DE NOTAS ============ */
.ajuda-notas { margin: -6px 0 12px; font-size: 13px; color: var(--texto-2); }
.lista-notas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lista-notas li {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: var(--raio-sm); background: var(--superficie-2); border: 1px solid var(--borda);
}
.lista-notas .pos { font-weight: 800; color: var(--texto-3); text-align: center; }
.lista-notas .quem { font-size: 13px; color: var(--texto-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista-notas li.atual { border-color: var(--amarelo); background: var(--amarelo-claro); }
.lista-notas li.feita { background: var(--verde-claro); border-color: transparent; }

.rodape { padding-bottom: 100px; }

@media (max-width: 420px) {
  .marca-icone { display: none; }
  .sinc { padding: 4px 8px; }
}
@media (max-width: 360px) {
  .nota-num { font-size: 26px; }
  .leitura { grid-template-columns: 64px minmax(0, 1fr) 46px; }
  .leitura .btn-icone { width: 46px; }
}
</style>
