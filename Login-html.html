<!-- Tela de login do painel (incluída pelas páginas de administração) -->
<div id="telaLogin" class="login oculto">
  <form id="formLogin" class="cartao login-caixa" autocomplete="on">
    <div class="login-marca">
      <span class="marca-icone">🚚</span>
      <div>
        <strong>Rota Gaúcha</strong>
        <div class="login-sub">Área administrativa</div>
      </div>
    </div>
    <div class="campo">
      <label for="loginSenha">Senha do painel</label>
      <input type="password" id="loginSenha" autocomplete="current-password" required>
    </div>
    <div id="loginErro" class="aviso aviso-erro oculto" role="alert"></div>
    <button type="submit" class="btn btn-primario">Entrar</button>
    <p class="login-ajuda">A senha é definida na planilha, no menu 🚚 Rota Gaúcha › Configurar sistema.</p>
  </form>
</div>
<style>
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .login-caixa { width: 100%; max-width: 380px; padding: 26px; display: flex; flex-direction: column; gap: 16px; }
  .login-marca { display: flex; align-items: center; gap: 12px; font-size: 18px; }
  .login-marca .marca-icone { background: var(--verde); color: #fff; }
  .login-sub { font-size: 13px; color: var(--texto-2); }
  .login-ajuda { margin: 0; font-size: 12px; color: var(--texto-3); }
</style>
